name: Deploy to Vercel

# Build on the GitHub runner (plenty of RAM) and upload the prebuilt output to Vercel.
# Requires repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# and the Vercel project env vars NEXT_DIST_DIR=.next, OMNIROUTE_SKIP_STANDALONE=1
# (type "Plain"/Config, NOT Sensitive). See thai-coder_DEPLOY_VERCEL.md.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on GitHub
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          GENERATE_SOURCEMAP: "false"
          NEXT_TELEMETRY_DISABLED: "1"
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
